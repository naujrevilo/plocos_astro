# Configuración de construcción para Netlify
[build]
  command = "pnpm build --remote"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.21.1"
  PNPM_VERSION = "10.22.0"
  NETLIFY_USE_PNPM = "true"

[functions]
  included_files = ["db/**"]
  external_node_modules = ["@libsql/linux-x64-gnu"]
